services:
  # ===========================================================================
  # 1. Database Services (MongoDB for all services)
  # ===========================================================================
  mongodb:
    image: mongo:7.0
    container_name: nutrition-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    networks:
      - nutrition-network
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ===========================================================================
  # 2. Service Discovery (Eureka Server)
  # ===========================================================================
  eureka-server:
    build:
      context: ./Eureka-Server
      dockerfile: Dockerfile
    container_name: eureka-server
    restart: unless-stopped
    environment:
      EUREKA_INSTANCE_HOSTNAME: eureka-server
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms64m -Xmx192m"
    ports:
      - "8761:8761"
    networks:
      - nutrition-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ===========================================================================
  # 3. Core Microservices (All using MongoDB)
  # ===========================================================================
  user-profile-service:
    build:
      context: ./User-Profile
      dockerfile: Dockerfile
    container_name: user-profile-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${USER_PROFILE_MONGODB_URI:-mongodb+srv://chatgpt2:riten13@cluster0.ioo4yf3.mongodb.net/user_profile_db?appName=Cluster0}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms64m -Xmx256m"
    ports:
      - "8080:8080"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - nutrition-network

  food-database-service:
    build:
      context: ./Food-Database
      dockerfile: Dockerfile
    container_name: food-database-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${FOOD_DB_MONGODB_URI:-mongodb+srv://chatgpt2:riten13@cluster0.ioo4yf3.mongodb.net/food_database?appName=Cluster0}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JWT_SECRET: ${JWT_SECRET}
      AWS_REGION: ${AWS_REGION:-ap-southeast-2}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:-nutrition-tracker-food-images-2026-new}
      AWS_PROFILE: ${AWS_PROFILE:-}
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms64m -Xmx256m"
    volumes:
      - ${USERPROFILE:-~}/.aws:/root/.aws:ro
    ports:
      - "3000:3000"
    depends_on:
      eureka-server:
        condition: service_healthy
    networks:
      - nutrition-network

  meal-planning-service:
    build:
      context: ./Meal-Planning
      dockerfile: Dockerfile
    container_name: meal-planning-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${MEAL_PLANNING_MONGODB_URI:-mongodb+srv://chatgpt2:riten13@cluster0.ioo4yf3.mongodb.net/food_database?appName=Cluster0}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      FOOD_SERVICE_URL: http://food-database-service:3000
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms64m -Xmx256m"
    ports:
      - "3001:3001"
    depends_on:
      eureka-server:
        condition: service_healthy
      food-database-service:
        condition: service_started
    networks:
      - nutrition-network

  grocery-planning-service:
    build:
      context: ./Grocery-Planning
      dockerfile: Dockerfile
    container_name: grocery-planning-service
    restart: unless-stopped
    environment:
      SPRING_DATA_MONGODB_URI: ${GROCERY_PLANNING_MONGODB_URI:-mongodb+srv://chatgpt2:riten13@cluster0.ioo4yf3.mongodb.net/grocery_planning_db?appName=Cluster0}
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      FOOD_SERVICE_URL: http://food-database-service:3000
      MEAL_PLANNING_SERVICE_URL: http://meal-planning-service:3001
      JWT_SECRET: ${JWT_SECRET}
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms64m -Xmx256m"
    ports:
      - "3002:3002"
    depends_on:
      eureka-server:
        condition: service_healthy
      food-database-service:
        condition: service_started
      meal-planning-service:
        condition: service_started
    networks:
      - nutrition-network

  # ===========================================================================
  # 4. API Gateway
  # ===========================================================================
  api-gateway:
    build:
      context: ./API-Gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    restart: unless-stopped
    environment:
      EUREKA_SERVER_URL: http://eureka-server:8761/eureka/
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xss256k -XX:MaxMetaspaceSize=128m -Xms64m -Xmx256m"
    ports:
      - "8088:8088"
    depends_on:
      eureka-server:
        condition: service_healthy
      user-profile-service:
        condition: service_started
      food-database-service:
        condition: service_started
      meal-planning-service:
        condition: service_started
      grocery-planning-service:
        condition: service_started
    networks:
      - nutrition-network

  # ===========================================================================
  # 5. Frontend Client
  # ===========================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8088}
    container_name: nutrition-frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api-gateway
    networks:
      - nutrition-network

# =============================================================================
# Networks & Volumes
# =============================================================================
networks:
  nutrition-network:
    driver: bridge

volumes:
  mongodb_data:
